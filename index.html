<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse GilMars stays, check availability, and manage your reservation with StaySync."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#faf7f2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121917"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors resolveTheme in src/lib/theme.ts.
      (function () {
        var t = "system";
        try {
          var s = localStorage.getItem("theme");
          if (s === "light" || s === "dark") t = s;
        } catch (e) {}
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta property="og:title" content="GilMars StaySync" />
    <meta
      property="og:description"
      content="Browse GilMars stays, check availability, and manage your reservation with StaySync."
    />
    <meta
      property="og:image"
      content="https://gil-mars-stay-sync-old.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GilMars StaySync logo" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://gil-mars-stay-sync-old.vercel.app/"
    />
    <meta property="og:site_name" content="GilMars StaySync" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GilMars StaySync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
